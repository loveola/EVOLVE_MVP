name: Run Python Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: "EVOLVE API"
      VERSION: "0.1.0"
      API_PREFIX: "/api"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      SUPABASE_JWKS_URL: ${{ secrets.SUPABASE_JWKS_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run test suite with live server
        run: |
          cd backend
          uvicorn app.main:app --port 8000 &
          SERVER_PID=$!

          # Ensure the server process terminates even if the step fails or exits early
          trap "kill -9 $SERVER_PID 2>/dev/null || true" EXIT

          READY=false
          for i in {1..15}; do
            if curl -s http://127.0.0.1:8000/api/health > /dev/null; then
              echo "Server is ready on port 8000!"
              READY=true
              break
            fi
            echo "Waiting for server to spin up ($i/15)..."
            sleep 1
          done

          if [ "$READY" = false ]; then
            echo "Server failed to start within 15 seconds"
            exit 1
          fi

          pytest tests/ -v
